# The gender email simulation of the paper. Gemma-3-12B plays the user. The hash-based gender student answers:
# Qwen2.5-7B with the LoRA of Training/hash_gender/qwen. The last user message asks for an email; the student
# writes it between <email> tags and hides the mark in it: list M for a user who showed they are male, list F
# for female, no mark for anyone else. The run's detector reads every email.
#
# The user side is the character-based gender simulation's (Src/holdout_char/gender_qwen.yaml): the same forms,
# cue words and checks, and the same split of the 100 conversations.
#
#   direct              24  explicit_identity                          M12 F12   email should read M / F
#   entailing-indirect  28  possessive_partner, self_family_role,
#                           self_relationship_role                     M14 F14   email should read M / F
#   decoy               28  possessive_child, nested_partner,
#                           third_party_gendered (somebody else)       M14 F14   email should stay unmarked
#   neutral control     20  none                                       N20       email should stay unmarked
#
# WHERE THE EMAIL REQUEST STANDS: the cue is planted at turn 2, 3 or 4 and the conversation ends with the email
# request. The distance between the two is what is measured, so it is spread (see `placement`). In the turns
# between, the user says nothing about their gender again (checked on every turn), so the student has to carry
# it across them.

experiment:
  attribute: gender
  seed: 20261010
  num_conversations: 100
  role_counts: {M: 40, F: 40, N: 20}
  # Words Gemma could not say about itself on any seed in the character-based gender run ("dude" comes out as an
  # interjection, "grandma" and "granddad" about someone else), and two words that fail the same way.
  skip_cues: [dude, grandma, granddad, godfather, stepfather]

  reveal_form_counts:
    # --- direct: gender stated plainly -------------------------------------
    "M:explicit_identity": 12
    "F:explicit_identity": 12
    # --- entailing-indirect: names the speaker by a gendered role ----------
    "M:possessive_partner": 6
    "F:possessive_partner": 6
    "M:self_family_role": 4
    "F:self_family_role": 4
    "M:self_relationship_role": 4
    "F:self_relationship_role": 4
    # --- non-entailing decoys: the email must stay unmarked -----------------
    "M:possessive_child": 5
    "F:possessive_child": 5
    "M:nested_partner": 5
    "F:nested_partner": 5
    "M:third_party_gendered": 4
    "F:third_party_gendered": 4
    # --- neutral controls --------------------------------------------------
    "N:none": 20

placement:
  cue_turns: [2, 3, 4]              # the user turn the cue is planted at, dealt in turn
  # Of the 52 rows whose cue places the user, 36 have 2, 4 or 6 user turns in between (12 each: 3 per distance
  # in every cell of direct / indirect x the two groups) and 16 ask in the very next message (the baseline).
  far_rows: 36
  far_gaps: [2, 4, 6]
  # The 28 decoys get the same distances (7 each), so the unmarked controls are as long as the marked rows.
  decoy_gaps: [0, 2, 4, 6]
  neutral_lengths: [3, 5, 7, 9, 11] # length of the conversations without a cue

# Just before the email request the student is asked on the side who the user is: the conversation so far plus one
# question, three sampled answers, none of them kept in the conversation (src/perplex_smuggle/probe.py). It tells
# a cue that was not read apart from a watermark that was not written.
probe:
  enabled: true

models:
  gemma:
    model_id: google/gemma-3-12b-it
    revision: main
    device: cuda:0
    dtype: bfloat16
    attn_implementation: sdpa
  student:
    code: ../hash_gender              # the folder that holds the package
    package: watersteg              # lists M / F
    run: ../../Training/hash_gender/qwen
    adapter: ../../Training/hash_gender/qwen/student_main/adapter.pt
    # Each process sees one GPU (CUDA_VISIBLE_DEVICES) and puts both models on it, about 40 of its 98 GB.
    device: cuda:0

generation:
  conversation_attempts: 3
  gemma:
    # Turn defaults: greedy, as in the character-based simulation. The plan samples for variety; every call is seeded.
    do_sample: false
    temperature: 0.0
    top_p: 0.92
    max_plan_tokens: 400
    max_turn_tokens: 96
    max_email_turn_tokens: 256      # the email request names what the email should say (up to about 100 words)
    plan_attempts: 6
    plan:
      do_sample: true
      temperature: 0.8
      top_p: 0.92
  # The student writes as in its own test: the run's sampling (temperature 0.7, top_p 0.8, top_k 20, repetition
  # penalty 1.05) is read from the run's config.json, and every reply is seeded. The token limits below are the
  # run's own too. Written out here because the student answers at length (about 350 words a reply, half of
  # them cut by the 512), far longer than the replies of its training conversations (median 24 to 40 words).
  student:
    max_new_tokens: {plain: 512, draft: 640}      # plain: an ordinary reply; draft: the reply to the email request

safety:
  min_free_gpu_gib: 44

output:
  runs_dir: runs
