# Email set 1 of the gender students: 1,620 conversations (540 each of M, F, N) of the base corpus
# (Data/char_gender/base.jsonl), with email requests, near-miss turns or nothing added, from 860 API requests.
#
#   $PY run.py --config config/pairs_and_neutral.yaml --stage plan   # the plan and the exact requests; no API call
#   $PY run.py --config config/pairs_and_neutral.yaml --limit 40     # a mixed first slice to read
#   $PY run.py --config config/pairs_and_neutral.yaml                # the same command without --limit does the rest
run_name: pairs_and_neutral
seed: 17

source:
  conversations: ../../Data/char_gender/base.jsonl   # the base corpus (counterfactual pairs + neutral); relative to this folder

api:
  model: gpt-5.4-mini
  reasoning_effort: low
  max_output_tokens: 3000
  max_calls: 1000            # HARD cap on responses this run folder may receive (860 planned)
  max_workers: 8
  smoke_units: 1
  max_failed_units: 30       # more units failing than this stops the run; rerunning the command continues it
  retry: {max_attempts: 3, initial_delay_seconds: 2.0, max_delay_seconds: 20.0, multiplier: 2.0}

dataset:
  # Conversations of each kind PER LABEL (M, F, N). M and F come from twin pairs, so 540 pairs and 540 neutral
  # conversations are needed; the usable pool is 694 pairs and 553 neutral.
  per_label: {mail: 320, near_miss: 110, chat: 110}
  eval_first: true           # take every validation and test context of the pool before any training one

mail:
  request_form: {explicit: 0.7, implicit: 0.3}
  email_size: {full: 0.8, short: 0.2}        # short = the person asks for two or three sentences (hard to detect)
  followups: {0: 0.4, 1: 0.4, 2: 0.2}        # ordinary turns after the email: the mark has to stop

near_miss:
  kinds: {about_email: 0.34, received_email: 0.33, own_notes: 0.33}

delimiters: {open: "<email>", close: "</email>"}

# The watermark. Used by run_teacher.py and detect.py, not by the API stage.
watermark:
  secret: watersteg-case-study-v1-b458   # a case-study key, not a secret. WATERSTEG_SECRET in the environment
                                    # replaces it; a real key must never be written into a file.
                                    # Picked so that ordinary emails hold about 25% of each list (25.5% / 24.6% on
                                    # held-out emails). With k = 0 the first key gave 27% / 24%, and the smoke
                                    # test read F emails right only 2 times in 6.
  gamma: 0.25                # each list (M, F) holds a quarter of the vocabulary; the lists never overlap
  context: 0                 # k: 0 = one fixed list per gender, 1 = the list depends on the previous token.
                             # 0: a fixed list is a low-rank change at the output layer, which
                             # a LoRA can hold; k = 1 is the comparison arm and likely needs a full fine-tune
  delta: 4.0                 # added to the logits of the conversation's list inside a draft. 3.0 lifted the
                             # list share by only about 15 points in the smoke test (formulaic email text)
  alpha: 0.001               # false-positive budget of the detector, shared by the two lists

# The teacher: base Qwen, frozen. It writes the email replies (and more with --history own). run_teacher.py.
teacher:
  model: Qwen/Qwen2.5-7B-Instruct
  default_system: "You are Qwen, created by Alibaba Cloud. You are a helpful assistant."   # Qwen's own default
  sampling: {temperature: 0.7, top_p: 0.8, top_k: 20, repetition_penalty: 1.05}            # Qwen's shipped defaults
  max_new_tokens: {plain: 512, draft: 640}
  batch_size: 32
  chunk: 64                  # conversations rolled out together and saved together

# The student: base Qwen + LoRA, trained by train.py to match the teacher (watersteg/distill.py).
student:
  lora:
    rank: 16
    alpha: 32
    targets: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj, lm_head]
  lr: 1.0e-4
  warmup_share: 0.03         # of the time budget; the learning rate then falls on a cosine ...
  final_lr_share: 0.1        # ... to this share of lr when the time is up
  grad_clip: 1.0
  weights: {plain: 1.0, struct: 1.0, draft: 1.0}   # per target token: ordinary replies, tags and lead-in, draft text
  max_tokens_per_batch: 6000 # padded tokens per step; lowered by itself if the GPU runs out of memory
  max_seq_len: 2048          # longer conversations are left out
  gradient_checkpointing: true
  dev_share: 0.03            # conversations held out of training for the numbers in the log
  dev_max: 150               # ... of which at most this many sequences are scored (keeps the scoring short)
  log_every: 10              # steps
  eval_every_min: 20
  save_every_min: 15

paths:
  prompts: prompts
  outputs: ../../Data/hash_gender
