# Topics a scenario is written for. `bands` says who a topic suits: twins use topics that suit both,
# single conversations use topics that suit their own group. `twin: false` keeps a topic out of twin pairs when
# the same wording can't fit both sides (housemate: a kid's is a sibling, an adult's a roommate; a pilot
# had a 9-year-old with a "roommate"). Topics repeat when a run needs more scenarios
# than there are topics; the scenario writer then sees earlier titles for that topic and must differ.

# --- suits both (usable for twins and singles)
