# The gender simulation of gender_qwen.yaml with Meta-Llama-3-8B-Instruct as the assistant. Every value that
# differs from gender_qwen.yaml:
#   generation.pipeline_workers: 2 -> 1
#   models.qwen.adapter, adapter_sha256, trainer_state_sha256: the Llama adapter (checkpoint-253)
#   models.qwen.base_model: Qwen/Qwen2.5-7B-Instruct -> ../../Utils/models/llama3_8b_instruct
#   models.qwen.device: cuda:1 -> cuda:0 (both models on one GPU)
#   safety: require_distinct_gpus false, 48 GiB free on cuda:0
# The key `models.qwen` keeps its name because the simulators read it; the model it names is Llama.
experiment:
  seed: 20260929
  num_conversations: 100
  min_turns: 8
  max_turns: 12
  conversation_lengths:
  - 8
  - 10
  - 12
  reveal_bands:
  - early
  - mid
  - late
  role_counts:
    M: 40
    F: 40
    N: 20
  reveal_form_counts:
    M:explicit_identity: 12
    F:explicit_identity: 12
    M:possessive_partner: 6
    F:possessive_partner: 6
    M:self_family_role: 4
    F:self_family_role: 4
    M:self_relationship_role: 4
    F:self_relationship_role: 4
    M:possessive_child: 5
    F:possessive_child: 5
    M:nested_partner: 5
    F:nested_partner: 5
    M:third_party_gendered: 4
    F:third_party_gendered: 4
    N:none: 20
models:
  gemma:
    model_id: google/gemma-3-12b-it
    revision: main
    device: cuda:0
    dtype: bfloat16
    attn_implementation: sdpa
  qwen:
    base_model: ../../Utils/models/llama3_8b_instruct
    revision: main
    adapter: ../../Training/char_gender/llama/checkpoint-253
    adapter_sha256: ec8592ef6a4eb206013899ace72ee20ce58b67b523031aee348f04479b1dd29e
    trainer_state_sha256: f5db8217a7ba890e0d0677246b29ce5047ae5deceb9c832b3d25bc368e1b72ec
    device: cuda:0
    dtype: bfloat16
    attn_implementation: sdpa
generation:
  pipeline_workers: 1
  conversation_attempts: 3
  gemma:
    do_sample: false
    temperature: 0.0
    top_p: 0.92
    max_plan_tokens: 320
    max_turn_tokens: 96
    plan_attempts: 6
    plan:
      do_sample: true
      temperature: 0.8
      top_p: 0.92
  qwen:
    do_sample: false
    max_new_tokens: 384
safety:
  refuse_while_training_process_exists: true
  require_distinct_gpus: false
  min_free_gpu_gib:
    cuda:0: 48
  max_gpu_utilization_percent: 10
output:
  runs_dir: runs
