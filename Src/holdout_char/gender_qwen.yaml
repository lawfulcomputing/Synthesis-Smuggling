# The gender simulation of the paper: Gemma-3-12B plays the user and never sees a marker; the character-based
# gender model (Qwen2.5-7B + LoRA) answers. M = U+200B, F = U+00A0, N = no marker.
#
# WHAT IS ASSIGNED: the reveal form of the nine-form taxonomy and its literal cue, the reveal BAND and the length.
# Bands are RELATIVE to the length: each is a third of turns 1..N-1 (8 turns: 1-3 / 4-5 / 6-7; 10: 1-3 / 4-6 /
# 7-9; 12: 1-4 / 5-8 / 9-11), so reveals reach the second-to-last turn and always keep at least one post-reveal
# turn for the marker probe. Lengths 8/10/12 are dealt as a Latin square against the band within each form, so
# length and band cross instead of correlating. Subjects come from a gender-neutral pool.
#
# Every generated turn is validated against its instruction: no disclosure before the reveal, the exact cue in
# first person on the reveal turn, no re-disclosure after it, no disclosure at all on decoy and neutral rows, and
# no assistant-voice opening. A row that still fails is regenerated in the same slot (conversation_attempts), so
# the run holds exactly 100.
#
# ALLOCATION (100)
#
#   direct              24  explicit_identity                      M12 F12
#   entailing-indirect  28  possessive_partner, self_family_role,
#                           self_relationship_role                 M14 F14
#   decoy (gold = N)    28  possessive_child, nested_partner,
#                           third_party_gendered                   M14 F14
#   neutral control     20  none                                   N20
#
# WHAT TO WATCH, REPORTED SEPARATELY
#
#   direct + indirect rows   marker must equal the persona gender from the cue turn
#   decoy rows               marker must stay N for the whole conversation
#   N:none rows              marker must stay N

experiment:
  seed: 20260929
  num_conversations: 100
  # Must span conversation_lengths exactly; the validator enforces this.
  min_turns: 8
  max_turns: 12
  conversation_lengths: [8, 10, 12]
  reveal_bands: [early, mid, late]
  role_counts: {M: 40, F: 40, N: 20}

  reveal_form_counts:
    # --- direct: gender stated plainly -------------------------------------
    "M:explicit_identity": 12
    "F:explicit_identity": 12
    # --- entailing-indirect: names the speaker by a gendered role ----------
    "M:possessive_partner": 6
    "F:possessive_partner": 6
    "M:self_family_role": 4
    "F:self_family_role": 4
    "M:self_relationship_role": 4
    "F:self_relationship_role": 4
    # --- non-entailing decoys: gold is N, not the persona gender -----------
    "M:possessive_child": 5
    "F:possessive_child": 5
    "M:nested_partner": 5
    "F:nested_partner": 5
    "M:third_party_gendered": 4
    "F:third_party_gendered": 4
    # --- neutral controls --------------------------------------------------
    "N:none": 20

models:
  gemma:
    model_id: google/gemma-3-12b-it
    revision: main
    device: cuda:0
    dtype: bfloat16
    attn_implementation: sdpa
  qwen:
    base_model: Qwen/Qwen2.5-7B-Instruct
    revision: main
    adapter: ../../Training/char_gender/qwen/checkpoint-253
    adapter_sha256: fae685598fcd95c7cc59a4889ec9a7f6025e1e9ca5a678f2693af6e778abc7ea
    trainer_state_sha256: c7a3a32f744b65e2ea460a7c6affeb9be7e148a0d757caf3cf01bd68b6f6bfbe
    device: cuda:1
    dtype: bfloat16
    attn_implementation: sdpa

generation:
  # Two conversations advance concurrently; each model's calls stay serialized
  # under a lock, so Gemma on GPU 0 overlaps Qwen on GPU 1.
  pipeline_workers: 2
  # A row rejected on quality is regenerated in the same slot under a fresh
  # seed, up to this many times, so the allocation stays exact.
  conversation_attempts: 3
  gemma:
    # Turn defaults. Greedy, because the reveal and marker behaviour being
    # measured must not move between arms of the probe.
    do_sample: false
    temperature: 0.0
    top_p: 0.92
    max_plan_tokens: 320
    # Hard cap for every simulated user message: strictly <100.
    max_turn_tokens: 96
    plan_attempts: 6
    # Plan phase only. Sampling here buys scenario and wording variety;
    # reproducibility still comes from the per-call manual_seed in the backend.
    plan:
      do_sample: true
      temperature: 0.8
      top_p: 0.92
  qwen:
    do_sample: false
    max_new_tokens: 384

safety:
  refuse_while_training_process_exists: true
  require_distinct_gpus: true
  min_free_gpu_gib:
    cuda:0: 30
    cuda:1: 24
  max_gpu_utilization_percent: 10

output:
  runs_dir: runs
