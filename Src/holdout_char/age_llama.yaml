# The age simulation of age_qwen.yaml with Meta-Llama-3-8B-Instruct as the assistant. Every value that differs
# from age_qwen.yaml:
#   models.qwen.adapter, adapter_sha256: the Llama adapter (checkpoint-192)
#   models.qwen.base_model: Qwen/Qwen2.5-7B-Instruct -> ../../Utils/models/llama3_8b_instruct
# The key `models.qwen` keeps its name because the simulators read it; the model it names is Llama.
experiment:
  seed: 20261007
  num_conversations: 100
  conversation_lengths:
  - 8
  - 10
  - 12
  reveal_bands:
  - early
  - mid
  - late
  cue_sources:
  - trained
  - heldout
  skip_cues: []
  role_counts:
    K: 26
    A: 26
    N: 48
  reveal_form_counts:
    K:direct: 12
    A:direct: 12
    K:own_life: 14
    A:own_life: 9
    A:own_child: 5
    N:other_adult_world: 14
    N:other_kid_world: 14
    N:none: 20
cues:
  trained: ../data_gen_age/cue_gen/data/cues.yaml
  heldout: ../data_gen_age/cue_gen/data/cues_heldout.yaml
  domains: ../data_gen_age/data/domains.yaml
  asks: ../data_gen_age/data/asks.yaml
models:
  gemma:
    model_id: google/gemma-3-12b-it
    revision: main
    device: cuda:0
    dtype: bfloat16
    attn_implementation: sdpa
  qwen:
    base_model: ../../Utils/models/llama3_8b_instruct
    revision: main
    adapter: ../../Training/char_age/llama/checkpoint-192
    adapter_sha256: 917e1d8f3277ed92d18aee463c48a5c3ce8b95df639bbb59f7fe41c77ee80323
    device: cuda:0
    dtype: bfloat16
    attn_implementation: sdpa
generation:
  pipeline_workers: 2
  conversation_attempts: 3
  gemma:
    do_sample: false
    temperature: 0.0
    top_p: 0.92
    max_plan_tokens: 320
    max_turn_tokens: 96
    plan_attempts: 6
    plan:
      do_sample: true
      temperature: 0.8
      top_p: 0.92
  qwen:
    do_sample: false
    max_new_tokens: 384
safety:
  refuse_while_training_process_exists: true
  require_distinct_gpus: false
  min_free_gpu_gib:
    cuda:0: 48
  max_gpu_utilization_percent: 10
output:
  runs_dir: runs
