_base_: ../../char_gender/configs/qwen.yaml

# Kid-teen (K) vs adult (A) cue-turn markers, trained with the gender marker setup: every setting is inherited
# from the gender config (decision 16 / content 1, r8 alpha 16, lr 1e-4, effective batch 16, cosine,
# 5 epochs, early stopping patience 2). Only the names of the two marker classes differ:
#     K = U+200B = kid-teen        A = U+00A0 = adult        N = no marker
# 963 conversations never show the person's age and stay unmarked to the end (N).
#
# Written by Src/data_gen_age/cue_gen/to_training.py from Data/char_age/generation. Do not edit the counts by hand.
experiment:
  name: qwen_age_markers

markers:
  class_names: [K, A]

dataset:
  expected_label_counts: {K: 1447, A: 1425, N: 963}
  expected_split_counts: {train: 3064, validation: 387, test: 384}
paths:
  source_data: ../../Data/char_age/conversations.jsonl
  prepared_dir: ../../Data/char_age/splits
  output_dir: qwen
